<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08131b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Word Ladder" />
    <meta name="description" content="Daily Word Ladder wedding-themed game." />
    <title>Daily Word Ladder</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-header">
        <h1>Daily Word Ladder</h1>
        <div class="date-box" aria-label="Date badge">
          <span class="date-no">NO. 300</span>
          <span class="date-day">OCT 27</span>
        </div>
      </header>

      <section class="panel howto-panel" aria-label="How to play section">
        <h2>How to play</h2>
        <button class="plus-button" type="button" aria-label="Show instructions">+</button>
      </section>

      <section class="panel ladder-panel" aria-label="Game board">
        <div class="ladder-topbar">
          <p>Climb from <span class="word-inline start-word">HATE</span> to <span class="word-inline goal-word">LOVE</span></p>
          <span class="steps">2 steps</span>
        </div>

        <div id="ladderBoard" class="ladder-board" aria-live="polite"></div>

        <div class="action-row" aria-label="Game actions">
          <button type="button" class="ghost-btn">Undo</button>
          <button type="button" class="ghost-btn">Hint</button>
          <button type="button" class="ghost-btn">Practice ladder</button>
        </div>

        <div id="keyboard" class="keyboard" aria-label="On screen keyboard"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
